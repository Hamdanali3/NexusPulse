  <!-- Central Nexus Pulse Waveform -->
  <path d="M13 33H22L26.5 21L32.5 43L37.5 27L41 33H51" stroke="url(#nexusPulseStroke)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
